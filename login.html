<!doctype html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>लॉगिन — Banke Bihari</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <a href="/" class="brand">
    <div class="logo">🕉️</div>
    <div><b>Banke Bihari</b><span>Pujan Samagri</span></div>
  </a>
</header>

<div class="authWrap">
  <h1>लॉगिन करें</h1>
  <div id="msg"></div>
  <form id="loginForm">
    <input id="phone" placeholder="मोबाइल नंबर" pattern="[0-9]{10}" required>
    <input id="password" type="password" placeholder="पासवर्ड" required>
    <button class="primary" type="submit">लॉगिन करें</button>
  </form>
  <div class="switchLink">खाता नहीं है? <a href="/signup.html">नया खाता बनाएं</a></div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.innerHTML = '';
  const body = {
    phone: document.getElementById('phone').value,
    password: document.getElementById('password').value
  };
  const res = await fetch('/api/login', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
  });
  const data = await res.json();
  if (!res.ok) {
    if (data.needsVerification) {
      msg.innerHTML = `<div class="error">${data.error} — <a href="/signup.html">वापस साइनअप पर जाएं और OTP verify करें</a></div>`;
    } else {
      msg.innerHTML = `<div class="error">${data.error}</div>`;
    }
    return;
  }
  window.location.href = '/account.html';
});
</script>
</body>
</html>
