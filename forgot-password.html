<!doctype html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>पासवर्ड रीसेट करें — Banke Bihari</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#241A10">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<header class="top">
  <a href="/" class="brand">
    <div class="logo">🕉️</div>
    <div><b>Banke Bihari</b><span>Pujan Samagri</span></div>
  </a>
</header>

<div class="authWrap" id="phoneBox">
  <h1>पासवर्ड भूल गए?</h1>
  <p style="color:#64748b;font-size:14px">अपना रजिस्टर्ड मोबाइल नंबर डालें, हम OTP भेजेंगे</p>
  <div id="msg"></div>
  <form id="phoneForm">
    <input id="phone" placeholder="मोबाइल नंबर" pattern="[0-9]{10}" required>
    <button class="primary" type="submit">OTP भेजें</button>
  </form>
  <div class="switchLink"><a href="/login.html">वापस लॉगिन पर जाएं</a></div>
</div>

<div class="authWrap" id="resetBox" style="display:none">
  <h1>नया पासवर्ड बनाएं</h1>
  <div id="devHint" class="devHint"></div>
  <div id="resetMsg"></div>
  <form id="resetForm">
    <input id="otpInput" placeholder="6 अंकों का OTP" pattern="[0-9]{6}" maxlength="6" required style="text-align:center;font-size:22px;letter-spacing:8px">
    <input id="newPassword" type="password" placeholder="नया पासवर्ड" required minlength="4">
    <button class="primary" type="submit">पासवर्ड बदलें</button>
  </form>
</div>

<script>
let resetPhone = '';

document.getElementById('phoneForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.innerHTML = '';
  resetPhone = document.getElementById('phone').value;
  const res = await fetch('/api/forgot-password', {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ phone: resetPhone })
  });
  const data = await res.json();
  if (!res.ok) { msg.innerHTML = `<div class="error">${data.error}</div>`; return; }
  document.getElementById('phoneBox').style.display = 'none';
  document.getElementById('resetBox').style.display = 'block';
  if (data.devOtp) {
    document.getElementById('devHint').innerHTML =
      `⚠️ Test mode: असली SMS service अभी जुड़ी नहीं है। आपका OTP है: <b>${data.devOtp}</b>`;
  }
});

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('resetMsg');
  msg.innerHTML = '';
  const res = await fetch('/api/reset-password', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      phone: resetPhone,
      otp: document.getElementById('otpInput').value,
      newPassword: document.getElementById('newPassword').value
    })
  });
  const data = await res.json();
  if (!res.ok) { msg.innerHTML = `<div class="error">${data.error}</div>`; return; }
  window.location.href = '/account.html';
});
</script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(()=>{})); }
</script>
</body>
</html>
