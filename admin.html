<!doctype html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Banke Bihari</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#241A10">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<div class="adminTop">
  <b>🕉️ Banke Bihari — Admin Panel</b>
  <button class="accountBtn" id="logoutBtn" onclick="adminLogout()" style="display:none">Logout</button>
</div>

<div class="adminWrap" id="loginBox">
  <div class="authWrap" style="margin-top:40px">
    <h1>Admin Login</h1>
    <div id="loginMsg"></div>
    <form id="adminLoginForm">
      <input id="adminPassword" type="password" placeholder="Admin Password" required>
      <button class="primary" type="submit">Login</button>
    </form>
  </div>
</div>

<div class="adminWrap" id="dashBox" style="display:none">
  <div class="tabs">
    <button class="active" onclick="showTab('orders')" id="tabOrders">📦 Orders</button>
    <button onclick="showTab('products')" id="tabProducts">🛍️ Products</button>
    <button onclick="showTab('puja')" id="tabPuja">🪔 Puja Templates</button>
  </div>

  <div id="ordersTab">
    <table class="adminTable">
      <thead><tr><th>#</th><th>ग्राहक</th><th>फ़ोन</th><th>कुल</th><th>स्टेटस</th><th>अपडेट करें</th></tr></thead>
      <tbody id="ordersBody"></tbody>
    </table>
  </div>

  <div id="productsTab" style="display:none">
    <div class="formRow">
      <input id="pName" placeholder="Product नाम">
      <input id="pCategory" placeholder="Category">
      <input id="pPrice" placeholder="Price" type="number">
      <input id="pMrp" placeholder="MRP (optional)" type="number">
      <input id="pStock" placeholder="Stock (qty)" type="number" value="50">
      <select id="pImage">
        <option value="">कोई फोटो नहीं (emoji दिखेगा)</option>
        <option value="/product-murti.png">मूर्तियां placeholder</option>
        <option value="/product-diya.png">दीपक/दीया placeholder</option>
        <option value="/product-agarbatti.png">अगरबत्ती/धूप placeholder</option>
        <option value="/product-kalash.png">कलश/लोटा placeholder</option>
        <option value="/product-chunri.png">चुनरी/वस्त्र placeholder</option>
        <option value="/product-mala.png">माला/पुष्प placeholder</option>
        <option value="/product-havan.png">हवन सामग्री placeholder</option>
        <option value="/product-thali.png">पूजा थाली placeholder</option>
        <option value="/product-nariyal.png">नारियल/सुपारी placeholder</option>
        <option value="/product-kapoor.png">कपूर/रोली/चंदन placeholder</option>
      </select>
      <button class="primary" onclick="addProduct()">+ Add Product</button>
    </div>
    <table class="adminTable">
      <thead><tr><th>नाम</th><th>Category</th><th>Price</th><th>MRP</th><th>⭐ Rating</th><th>Stock</th><th></th></tr></thead>
      <tbody id="productsBody"></tbody>
    </table>
  </div>

  <div id="pujaTab" style="display:none">
    <p style="font-size:13px;color:#64748b;margin-bottom:14px">
      यहां हर पूजा के लिए सामान की लिस्ट बनाई/बदली जा सकती है। "matchName" खाली छोड़ें तो item सिर्फ text checklist में दिखेगा, catalog से नहीं जुड़ेगा।
    </p>
    <div id="pujaList"></div>
    <div class="formRow" style="margin-top:20px">
      <input id="ptName" placeholder="नई पूजा का नाम (जैसे: नवरात्रि पूजा)">
      <input id="ptDescription" placeholder="Description (optional)">
      <button class="primary" onclick="addPujaTemplate()">+ नई पूजा टेम्पलेट बनाएं</button>
    </div>
  </div>
</div>

<script src="/admin.js"></script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(()=>{})); }
</script>
</body>
</html>
